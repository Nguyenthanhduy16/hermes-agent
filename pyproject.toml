[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-zalo-bot"
version = "0.1.0"
description = "Official Zalo Bot Platform adapter for Hermes Agent"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1,<1", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
sheets = ["google-auth[requests]>=2.55.1,<3"]

[project.scripts]
zalo-bot = "hermes_zalo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
