services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-zalo-bot:local
    # Deliberately fixed: a second polling process must not share one bot token.
    container_name: hermes-zalo-bot
    # The image already runs tini as PID 1.
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - path: .env.docker
        required: true
    volumes:
      - bot-data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    # Long polling needs no host port or public domain. The image HEALTHCHECK
    # probes /healthz only when ZALO_ADMIN_ENABLED=true (see docs/production.md).
    # Optional console behind a reverse proxy on this host: set ZALO_ADMIN_ENABLED,
    # ZALO_CONVERSATIONS_ENABLED, ZALO_ADMIN_HOST=0.0.0.0 and the HTTPS
    # ZALO_ADMIN_PUBLIC_URL in .env.docker, then publish to loopback only:
    # ports:
    #   - "127.0.0.1:8787:8787"

volumes:
  bot-data:
